<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italianno&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body>

    <div class="container">
        <!-- ROW 1 -->
        <div class="card row1-left">
            <div class="item square square-r1l"></div>
            <div class="item square square-r1l"></div>
            <div class="item square square-r1l"></div>
        </div>
  
        <div class="card row1-right">
            <div class="item rectangle-v"></div>
            <div class="item rectangle-v"></div>
            <div class="item rectangle-v"></div>
        </div>

        <!-- ROW 2 -->
        <div class="card row2-left">
            <div class="item square"></div>
            <div class="item square"></div>
            <div class="item square"></div>
        </div>
  
        <div class="card row2-right">
            <div class="item square square-r2r"></div>
            <div class="item square square-r2r"></div>
            <div class="item square"></div>
        </div>

        <!-- ROW 3 -->
        <div class="card row3-left">
            <div class="item rectangle-v"><p class="text-rectangle-v">Some text</p></div>
            <div class="item square"><p>Some text</p></div>
            <div class="item rectangle-v"><p class="text-rectangle-v">Some text</p></div>
        </div>
  
        <div class="card row3-right">
            <div class="item square square-r3r"></div>
            <div class="item rectangle-h"></div>
            <div class="item square"></div>
        </div>
    </div>

</body>
</html>
